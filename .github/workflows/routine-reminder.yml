# 다썼텅 루틴 알림 — 매일 밤 폰으로 "루틴 체크할 시간" 푸시 신호를 보낸다.
# 알림 내용(안 한 루틴 목록)은 폰 안의 앱 데이터로 만들어지고, 여기선 신호만 보냄(루틴 기록은 GitHub에 안 올라감).
#
# 필요한 Secret 2개 (moattung 저장소 Settings → Secrets and variables → Actions):
# ※ 다했텅(daily-reminder)과 한 저장소를 쓰므로 이름이 겹치지 않게 DASSEOTTUNG_ 접두어를 붙였다.
#   DASSEOTTUNG_VAPID_PRIVATE_KEY : 다썼텅 전용 비밀 키 (다했텅 키와 다름!)
#   DASSEOTTUNG_PUSH_SUBSCRIPTION : 다썼텅 앱 마이페이지 → 설정 → "🔔 루틴 알림"에서 복사한 코드
#
# 시간 바꾸기: cron은 UTC 기준(한국시간 - 9시간). GitHub 예약 작업은 보통 5~20분 늦게 돌아서 조금 일찍 잡아둠.
#   '45 12 * * *' = 한국시간 21:45 예약 → 대략 22시 전후 도착
name: routine-reminder

on:
  schedule:
    - cron: '45 12 * * *'
  workflow_dispatch: {} # Actions 탭에서 "Run workflow"로 바로 테스트 가능

jobs:
  push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Send push
        env:
          VAPID_PUBLIC_KEY: BPguPnBa-bKEv95yVzCdDT0Wm8j1t2wKU6vPPL8wCq8NUFd9zbXKc4JrJKaZ4_drm-Um6VEQYvY9oD122FITS7Q
          VAPID_PRIVATE_KEY: ${{ secrets.DASSEOTTUNG_VAPID_PRIVATE_KEY }}
          PUSH_SUBSCRIPTION: ${{ secrets.DASSEOTTUNG_PUSH_SUBSCRIPTION }}
        run: |
          npm install --no-save --silent web-push@3
          node -e '
            const webpush = require("web-push");
            if (!process.env.VAPID_PRIVATE_KEY || !process.env.PUSH_SUBSCRIPTION) {
              console.error("Secret(DASSEOTTUNG_VAPID_PRIVATE_KEY / DASSEOTTUNG_PUSH_SUBSCRIPTION)이 등록되지 않았어요"); process.exit(1);
            }
            webpush.setVapidDetails("https://goodthing90012.github.io/moattung/dasseottung/", process.env.VAPID_PUBLIC_KEY, process.env.VAPID_PRIVATE_KEY);
            const sub = JSON.parse(process.env.PUSH_SUBSCRIPTION);
            webpush.sendNotification(sub, JSON.stringify({ type: "routine-reminder" }), { TTL: 3 * 60 * 60, urgency: "high" })
              .then(r => console.log("보냄:", r.statusCode))
              .catch(e => {
                if (e.statusCode === 404 || e.statusCode === 410) {
                  console.error("폰 쪽 알림 등록이 만료됐어요. 다썼텅 앱 설정 → 루틴 알림에서 코드를 다시 복사해 DASSEOTTUNG_PUSH_SUBSCRIPTION을 갱신하세요.");
                } else if (e.statusCode === 403) {
                  console.error("키가 안 맞아요. DASSEOTTUNG_VAPID_PRIVATE_KEY가 다썼텅 전용 키인지 확인하세요(다했텅 키 X).");
                } else { console.error("발송 실패:", e.statusCode, e.body || e.message); }
                process.exit(1);
              });
          '
